[project]
name = "skillet"
version = "0.1.0"
description = "Skillet — the AI engineer's cookbook. Recipe framework and backend."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "sse-starlette>=2.1",
    # The real production ASGI server (`distribution`'s job, per
    # `scripts/e2e_recipes_server.py`'s own long-standing note that "no ASGI
    # server is a permanent dependency of this backend yet") — `[standard]`
    # for uvloop/httptools, matching every prior `--with 'uvicorn[standard]'`
    # invocation across this backend's own scripts/config now that it's a
    # first-class dependency rather than an ad hoc one.
    "uvicorn[standard]>=0.52.4",
    # `trial_limits/redis_client.py` speaks Upstash's REST API via a real
    # `httpx.AsyncClient` at runtime -- this was previously declared only in
    # the dev group below (harmless everywhere `uv sync`'s default,
    # dev-included behavior was in play, which was every context that had
    # ever run this app until now), a real bug caught building
    # `backend/Dockerfile`'s `--no-dev` production image: `uvicorn
    # skillet.api.app:app` crashed at import time with `ModuleNotFoundError:
    # No module named 'httpx'`.
    "httpx>=0.27",
]

[project.scripts]
skillet = "skillet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillet"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.23.1",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/skillet"]
